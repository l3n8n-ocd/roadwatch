<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RoadWatch: report road accidents, track their status, and see verified road updates." />
    <title>RoadWatch</title>
    <script>
      // Apply the saved theme before first paint (no flash). Default follows the system.
      try {
        var t = localStorage.getItem('rw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
