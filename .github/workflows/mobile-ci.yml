name: mobile-ci

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    tags: ['v*']
    branches: [dev, main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check project is scaffolded
        id: check
        run: if [ -f pubspec.yaml ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No pubspec.yaml yet, skipping."; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          channel: stable
      - name: Get packages
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get
      - name: Analyze
        if: steps.check.outputs.ready == 'true'
        run: flutter analyze
      # The APK is built on version tags and when someone presses "Run workflow" (Actions tab).
      # API_URL is the live Render API; a repository variable named API_URL overrides it.
      - name: Build release APK (tags and manual runs)
        if: steps.check.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://roadwatch-api-gnky.onrender.com/api' }}
      - name: Upload APK
        if: steps.check.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: roadwatch-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
