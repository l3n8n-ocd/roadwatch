name: mobile-ci

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    tags: ['v*']
    branches: [dev, main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub Release on v* tags
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check project is scaffolded
        id: check
        run: if [ -f pubspec.yaml ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No pubspec.yaml yet, skipping."; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          channel: stable
      - name: Get packages
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get
      - name: Analyze
        if: steps.check.outputs.ready == 'true'
        run: flutter analyze
      # The APK is built on version tags and when someone presses "Run workflow" (Actions tab).
      # API_URL is the live Render API; a repository variable named API_URL overrides it.
      - name: Check the tag matches pubspec.yaml (tags only)
        if: steps.check.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version. Update pubspec.yaml (and AppConfig.appVersion) first."
            exit 1
          fi
      - name: Build release APK (tags and manual runs)
        if: steps.check.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://roadwatch-api-gnky.onrender.com/api' }}
          cp build/app/outputs/flutter-apk/app-release.apk build/roadwatch.apk
      - name: Upload APK
        if: steps.check.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: roadwatch-apk
          path: mobile/build/roadwatch.apk
      # On a tag, the APK also goes to a GitHub Release. The web "Download the app" buttons link to
      # releases/latest/download/roadwatch.apk, which anyone can open without a GitHub account.
      - name: Publish GitHub Release (tags only)
        if: steps.check.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/roadwatch.apk \
            --title "RoadWatch $GITHUB_REF_NAME" \
            --notes "Android app for reporters and traffic officers. Install roadwatch.apk on the phone (allow installs from this source when Android asks). Administrators use https://roadwatch-theta.vercel.app."
