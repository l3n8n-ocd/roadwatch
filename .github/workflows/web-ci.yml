name: web-ci

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  push:
    branches: [dev, main]
    paths: ['web/**', '.github/workflows/web-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check project is scaffolded
        id: check
        run: if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet, skipping."; fi
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        if: steps.check.outputs.ready == 'true'
        run: npm run lint --if-present
      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: npm run build
